<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>StationHub Recorder</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        width: 300px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        background: #1a1b26;
        color: #e8eaed;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .url {
        font-size: 11px;
        color: #9aa0a6;
        word-break: break-all;
        margin-bottom: 10px;
        max-height: 36px;
        overflow: hidden;
      }
      .status { font-size: 12px; margin-bottom: 10px; }
      .recording { color: #f87171; font-weight: 600; }
      button {
        width: 100%;
        padding: 8px 12px;
        margin-top: 6px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      #btnStart { background: #3b82f6; color: #fff; }
      #btnStop { background: #ef4444; color: #fff; display: none; }
      #msg {
        margin-top: 10px;
        font-size: 11px;
        color: #86efac;
        word-break: break-all;
      }
      #msg.err { color: #fca5a5; }

      .recordsHeader {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 700;
        color: #e5e7eb;
      }
      .records {
        margin-top: 6px;
        max-height: 240px;
        overflow: auto;
        padding-right: 6px;
      }
      .recordRow {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .recordMeta {
        flex: 1;
        min-width: 0;
      }
      .recordName {
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recordSub {
        margin-top: 2px;
        font-size: 10px;
        color: #9aa0a6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recordButtons {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .smallBtn {
        width: 88px;
        padding: 6px 6px;
        margin-top: 0;
        border-radius: 8px;
        font-size: 10px;
      }
      .btnRun { background: #22c55e; color: #062a16; font-weight: 900; }
      .btnPush { background: #f59e0b; color: #3b2500; font-weight: 900; }
      .btnDelete { background: #ef4444; color: #fff; font-weight: 900; }
    </style>
  </head>
  <body>
    <h1>StationHub — Ghi script</h1>
    <div id="url" class="url">—</div>
    <div id="status" class="status">Chưa ghi</div>
    <button type="button" id="btnStart">Bắt đầu ghi</button>
    <button type="button" id="btnStop">Dừng &amp; lưu</button>
    <div id="msg"></div>
    <div class="recordsHeader">Records (local)</div>
    <div id="records" class="records"></div>
    <script src="popup.js"></script>
  </body>
</html>
