[package]
name = "datn-chrome-bridge"
version = "0.1.0"
edition = "2021"
description = "Chrome Native Messaging host for DATN Agent"

[[bin]]
name = "datn-chrome-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_System_Pipes"] }
