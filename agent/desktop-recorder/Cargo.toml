[package]
name = "stationhub-desktop-recorder"
version = "0.1.0"
edition = "2021"
description = "StationHub desktop automation recorder (Windows)"

[[bin]]
name = "stationhub-desktop-recorder"
path = "src/main.rs"

[dependencies]
rdev = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
eframe = { version = "0.29", default-features = true }
egui-phosphor = { version = "0.7.3", features = ["regular", "fill"] }

[target.'cfg(windows)'.dependencies]
stationhub-windows-uia = { path = "../stationhub-windows-uia" }
windows-sys = { version = "0.59", features = [
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
