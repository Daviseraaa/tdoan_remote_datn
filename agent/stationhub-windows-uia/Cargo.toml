[package]
name = "stationhub-windows-uia"
version = "0.1.0"
edition = "2021"
description = "Windows UI Automation capture/invoke for StationHub desktop recorder"

[dependencies]
serde_json = "1.0"
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
