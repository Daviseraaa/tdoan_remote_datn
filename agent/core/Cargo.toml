[package]
name = "datn-agent-native"
version = "0.1.0"
edition = "2021"
description = "DATN agent: Rust WebSocket agent + Windows service + IPC"

[[bin]]
name = "datn-agent-native"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.83"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
base64 = "0.22.1"
dotenvy = "0.15.7"
log = "0.4.22"
env_logger = "0.11.5"
futures-util = "0.3.30"
hostname = "0.4.0"
sysinfo = "0.31.4"
rust_socketio = { version = "0.6.0", features = ["async"] }
tokio-util = "0.7.12"
tokio = { version = "1.40.0", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "net",
  "sync",
  "time",
  "process",
  "signal",
] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
