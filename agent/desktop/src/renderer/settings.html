<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StationHub Agent</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <div id="loading" class="loading">
      <div class="loader-ring"></div>
      <span>Đang khởi tạo…</span>
    </div>

    <div id="app" class="shell hidden">
      <header class="topbar">
        <div class="brand">
          <div class="brand-logo-wrap">
            <img class="brand-logo" src="logo.ico" width="40" height="40" alt="" onerror="this.onerror=null;this.src='logo.png'" />
          </div>
          <div class="brand-copy">
            <div class="brand-title-row">
              <h1 class="brand-title">StationHub Agent</h1>
              <span class="version-chip" id="versionChip">v—</span>
            </div>
            <p class="brand-sub">Quản lý kết nối agent</p>
          </div>
        </div>
        <div class="topbar-deco" aria-hidden="true">
          <svg class="deco-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="5" y="8" width="14" height="10" rx="2"/>
            <circle cx="9" cy="12" r="1" fill="currentColor"/>
            <circle cx="15" cy="12" r="1" fill="currentColor"/>
            <path d="M9 5h6v3H9z"/>
          </svg>
          <svg class="deco-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 3l2 6h5l-4 4 1 7-4-3-4 3 1-7-4-4h5z"/>
          </svg>
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="Cài đặt"></nav>

      <div id="errorBanner" class="alert alert-error hidden"></div>

      <main class="content" id="panels"></main>

      <footer class="dock">
        <div class="dock-status" id="footerStatus">Sẵn sàng</div>
        <div class="dock-actions">
          <button type="button" class="btn btn-ghost" id="folderBtn">Thư mục config</button>
          <button type="button" class="btn btn-ghost" id="restartBtn">Khởi động lại</button>
          <button type="button" class="btn btn-primary" id="saveBtn">Lưu &amp; áp dụng</button>
        </div>
      </footer>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
